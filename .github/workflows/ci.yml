name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  portable-filenames:
    name: Windows-safe tracked file names
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail on paths Windows cannot check out
        # A backlog file with `"` and `:` in its name made
        # `git pull` fail for every Windows user. Reject <>:"\|?* , a trailing
        # space or dot, and reserved device names in any tracked path.
        run: |
          bad="$(git -c core.quotepath=off ls-files | grep -E '[<>:"\\|?*]|[ .]$|(^|/)(CON|PRN|AUX|NUL|COM[1-9]|LPT[1-9])(\.[^/]*)?(/|$)' || true)"
          if [ -n "$bad" ]; then
            echo "::error::Tracked paths that Windows cannot create:"
            echo "$bad"
            exit 1
          fi
          echo "All tracked paths are Windows-safe."

  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Regenerate version badge from pubspec.yaml
        run: dart run tool/generate_version.dart

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Reset any SDK auto-migrated analysis_options.yaml
        # `flutter pub get` on newer SDKs can silently rewrite
        # analysis_options.yaml (e.g. to add build/platform-dir excludes),
        # which then makes `dart pub publish --dry-run`'s git-cleanliness
        # check fail even though nothing we actually authored changed.
        run: git checkout -- analysis_options.yaml example/analysis_options.yaml

      - name: Publish dry-run
        run: dart pub publish --dry-run

  example-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Regenerate version badge from pubspec.yaml
        run: |
          flutter pub get
          dart run tool/generate_version.dart

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Analyze example
        working-directory: example
        run: flutter analyze

      - name: Run example tests
        working-directory: example
        run: flutter test

  wasm-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Regenerate version badge from pubspec.yaml
        run: |
          flutter pub get
          dart run tool/generate_version.dart

      - name: Install example dependencies
        working-directory: example
        run: flutter pub get

      - name: Build example for web (WASM)
        working-directory: example
        run: flutter build web --wasm

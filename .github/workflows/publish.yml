name: Publish to pub.dev

# Tag-triggered publishing via pub.dev's automated publishing (GitHub OIDC).
# No long-lived secrets: pub.dev must have "Automated publishing from GitHub
# Actions" enabled for this repository (package Admin tab, tag pattern
# v{{version}}). The old secrets-based OAuth flow hung indefinitely when the
# stored tokens expired.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    permissions:
      id-token: write # required for OIDC authentication with pub.dev
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1

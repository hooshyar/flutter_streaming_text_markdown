name: Weekly

on:
  schedule:
    # 06:00 UTC every Monday.
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  pub-upgrade:
    name: pub upgrade + analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Upgrade dependencies to their latest allowed versions
        run: flutter pub upgrade

      - name: Regenerate version badge from pubspec.yaml
        # example/lib/version.dart is generated and gitignored; without it
        # `flutter analyze` fails on example/ with a missing import.
        run: dart run tool/generate_version.dart

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

  fade-matrix:
    name: markdown fade invariant matrix (exhaustive, tag-gated)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Run the exhaustive markdown-fade invariant matrix
        run: flutter test --no-dds --tags fade_matrix --run-skipped

  pub-downgrade:
    name: pub downgrade + analyze (SDK floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.0

      - name: Downgrade dependencies to the lowest versions this package allows
        run: flutter pub downgrade

      - name: Regenerate version badge from pubspec.yaml
        run: dart run tool/generate_version.dart

      - name: Analyze
        run: flutter analyze

  pana:
    name: pana (pub score)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Activate pana
        run: dart pub global activate pana

      - name: Install webp tools
        # pana converts the pubspec screenshots with cwebp/gif2webp/webpinfo,
        # as pub.dev does; without them it fails the screenshot check.
        run: sudo apt-get update -q > /dev/null && sudo apt-get install -y -q webp > /dev/null

      - name: Run pana
        # On a lost point, the report's section lines become an annotation:
        # job logs are not always at hand, annotations are.
        run: |
          if ! dart pub global run pana --exit-code-threshold 0 . > pana.txt 2>&1; then
            echo "::error title=pana lost points::$(grep -E '^## |^### |Points:|ERROR|WARNING|[Ff]ailed' pana.txt | tail -n 60 | sed -e 's/%/%25/g' -e 's/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')"
            cat pana.txt
            exit 1
          fi
          grep -E 'Points:' pana.txt || tail -n 5 pana.txt

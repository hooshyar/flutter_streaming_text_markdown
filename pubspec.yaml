name: flutter_streaming_text_markdown
description: A Flutter package for beautiful LLM text streaming with markdown support. Perfect for ChatGPT-like interfaces with typing animations, RTL support, and customizable effects.
version: 1.10.0
homepage: https://github.com/hooshyar/flutter_streaming_text_markdown
repository: https://github.com/hooshyar/flutter_streaming_text_markdown
documentation: https://github.com/hooshyar/flutter_streaming_text_markdown/blob/main/README.md
topics:
  - llm
  - streaming
  - markdown
  - animation
  - ai

issue_tracker: https://github.com/hooshyar/flutter_streaming_text_markdown/issues

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  # Uses Color.withValues (Flutter 3.27 / Dart 3.6) and the Material 3
  # surfaceContainerHighest color role (Flutter 3.22), so the real floor is 3.27.
  sdk: '>=3.6.0 <4.0.0'
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  gpt_markdown: ^1.1.7
  characters: '>=1.4.0 <2.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter: 